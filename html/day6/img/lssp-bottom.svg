    <ellipse cx="632" cy="108" rx="4.5" ry="10" fill="#ddb95c" transform="rotate(-35 632 108)"/>
    <ellipse cx="631" cy="124" rx="4.5" ry="10" fill="#ddb95c" transform="rotate(-35 631 124)"/>
    <ellipse cx="655" cy="80" rx="4.5" ry="10" fill="#d1ad52" transform="rotate(35 655 80)"/>
